services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: invoice_app
      POSTGRES_DB: invoice_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  migrate:
    build: &backend_build
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /migrations
    volumes:
      - ./alembic.ini:/migrations/alembic.ini:ro
      - ./alembic:/migrations/alembic:ro
      - ./backend:/migrations/backend:ro
    environment: &database_env
      DATABASE_URL: ${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL}
      DOCKER_DATABASE_URL: ${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:?set TEST_DATABASE_URL}
    entrypoint: ['alembic']
    command: ['upgrade', 'head']
    depends_on:
      db:
        condition: service_healthy


  web:
    build: *backend_build
    container_name: invoice_api
    ports:
      - "8000:8000"
    environment: *database_env
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:





